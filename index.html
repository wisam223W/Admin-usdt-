<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaultUSD Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0b0f19; color: #e0e6ed; font-family: system-ui, -apple-system, sans-serif; padding: 10px; }
    .container { max-width: 800px; margin: auto; }
    .box { background: #141924; border: 1px solid #2a3444; border-radius: 8px; padding: 15px; margin-bottom: 10px; }
    h1 { text-align: center; margin-bottom: 10px; color: #00d4ff; }
    input, button { width: 100%; padding: 10px; margin: 5px 0; background: #1a2030; border: 1px solid #2a3444; color: #fff; border-radius: 6px; }
    button { background: #00d4ff; color: #000; font-weight: 600; cursor: pointer; }
    .hidden { display: none !important; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    th, td { padding: 8px; border-bottom: 1px solid #2a3444; text-align: right; }
    th { color: #8892a0; }
    .btn-sm { padding: 4px 8px; font-size: 12px; width: auto; margin: 0 4px; }
    .btn-green { background: #00d4ff; }
    .btn-red { background: #ff4444; color: #fff; }
    #gate { text-align: center; margin-top: 50px; }
  </style>
</head>
<body>
  <div id="gate" class="box">
    <h1>🔐 لوحة التحكم</h1>
    <input type="password" id="adminPass" placeholder="كلمة مرور الأدمن">
    <button id="btnGate">دخول</button>
  </div>

  <div id="dash" class="container hidden">
    <h1>لوحة تحكم VaultUSD</h1>
    <div class="box">
      <h3>📥 طلبات الإيداع</h3>
      <table><thead><tr><th>المستخدم</th><th>الشبكة</th><th>المبلغ</th><th>TXID</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="depTable"></tbody></table>
    </div>
    <div class="box">
      <h3>📤 طلبات السحب</h3>
      <table><thead><tr><th>المستخدم</th><th>الشبكة</th><th>العنوان</th><th>المبلغ</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="withTable"></tbody></table>
    </div>
    <div class="box">
      <h3>👥 المستخدمون</h3>
      <table><thead><tr><th>الاسم</th><th>الرصيد</th><th>الباقة</th><th>آخر ربح</th></tr></thead><tbody id="userTable"></tbody></table>
    </div>
  </div>

  <script type="module">
    const $ = id => document.getElementById(id);
    let auth, db;
    const firebaseConfig = {
      apiKey: "AIzaSyBEPY92lQXZHchrmPbmeNRjFG3FtkiN3a0",
      authDomain: "vaultusd-c1998.firebaseapp.com",
      projectId: "vaultusd-c1998",
      storageBucket: "vaultusd-c1998.firebasestorage.app",
      messagingSenderId: "627849430299",
      appId: "1:627849430299:web:d5680cc24a21861f367fbe"
    };

    try {
      const { initializeApp } = await import("https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js");
      const { getAuth } = await import("https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js");
      const { getFirestore } = await import("https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js");
      const app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
    } catch(e) { console.error(e); alert('خطأ في تحميل Firebase'); }

    $('btnGate').onclick = () => {
      if($('adminPass').value === '0000') {
        $('gate').classList.add('hidden'); $('dash').classList.remove('hidden');
        loadAdmin();
      } else alert('كلمة المرور خاطئة');
    };

    async function loadAdmin() {
      const { collection, onSnapshot, doc, updateDoc, increment, serverTimestamp } = await import("https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js");
      const { getDoc } = await import("https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js");

      // Deposits
      onSnapshot(collection(db, 'deposits'), snap => {
        $('depTable').innerHTML = '';
        snap.forEach(d => {
          const data = d.data();
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${data.uid.slice(0,8)}</td><td>${data.network}</td><td>$${data.amount}</td><td>${data.txid}</td><td>${data.status}</td>
          <td>${data.status==='pending'?`<button class="btn-sm btn-green" onclick="confirmDep('${d.id}','${data.uid}',${data.amount})">تأكيد</button>`:'-'}</td>`;
          $('depTable').appendChild(tr);
        });
      });

      // Withdrawals
      onSnapshot(collection(db, 'withdrawals'), snap => {
        $('withTable').innerHTML = '';
        snap.forEach(w => {
          const data = w.data();
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${data.uid.slice(0,8)}</td><td>${data.network}</td><td>${data.address.slice(0,10)}...</td><td>$${data.amount}</td><td>${data.status}</td>
          <td>${data.status==='pending'?`<button class="btn-sm btn-green" onclick="payWith('${w.id}')">تم الدفع</button>`:'-'}</td>`;
          $('withTable').appendChild(tr);
        });
      });

      // Users
      onSnapshot(collection(db, 'users'), snap => {
        $('userTable').innerHTML = '';
        snap.forEach(u => {
          const data = u.data();
          const last = data.lastProfitAdded?.toDate() || 'لم يسجل';
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${data.username}</td><td>$${(data.balance||0).toFixed(2)}</td><td>${data.activePackage||'لا يوجد'}</td><td>${typeof last==='object'?last.toLocaleDateString('ar'):last}</td>`;
          $('userTable').appendChild(tr);
        });
      });

      window.confirmDep = async (id, uid, amt) => {
        await updateDoc(doc(db, 'deposits', id), { status:'confirmed' });
        await updateDoc(doc(db, 'users', uid), { balance: increment(amt) });
        alert('✅ تم التأكيد وإضافة الرصيد');
      };

      window.payWith = async (id) => {
        await updateDoc(doc(db, 'withdrawals', id), { status:'paid' });
        alert('✅ تم تحديد السحب كمدفوع');
      };
    }
  </script>
</body>
</html>
