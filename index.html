<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaultUSD Admin</title>
  <style>
    :root { --bg: #0b0f19; --card: #151a28; --text: #e0e6ed; --primary: #00d4ff; --accent: #00ff88; --danger: #ff4444; --warn: #ffaa00; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .container { max-width: 1400px; margin: auto; }
    .login-box { max-width: 400px; margin: 100px auto; background: var(--card); padding: 30px; border-radius: 12px; text-align: center; }
    input, button, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #333; background: #1a2030; color: white; border-radius: 8px; box-sizing: border-box; }
    button { background: var(--primary); color: #000; font-weight: bold; cursor: pointer; border: none; }
    button:hover { opacity: 0.85; }
    table { width: 100%; border-collapse: collapse; margin: 20px 0; background: var(--card); border-radius: 8px; overflow: hidden; font-size: 14px; }
    th, td { padding: 12px; text-align: right; border-bottom: 1px solid #333; }
    th { background: #1a2030; color: var(--primary); }
    .status-pending { color: var(--warn); font-weight: bold; }
    .status-done { color: var(--accent); font-weight: bold; }
    .hidden { display: none !important; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media(max-width:900px){ .grid { grid-template-columns: 1fr; } }
    .panel { background: var(--card); padding: 20px; border-radius: 12px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1 style="text-align:center; color:var(--primary);">لوحة تحكم VaultUSD</h1>
    
    <div id="loginBox" class="login-box">
      <h2>دخول الأدمن</h2>
      <input type="password" id="adminPass" placeholder="كلمة المرور">
      <button id="adminLoginBtn">دخول</button>
    </div>

    <div id="adminPanel" class="hidden">
      <div class="grid">
        <div class="panel">
          <h3>📥 طلبات الإيداع (قيد المراجعة)</h3>
          <table id="depositsTable"><thead><tr><th>المستخدم</th><th>المبلغ</th><th>الشبكة</th><th>TXID</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody></tbody></table>
        </div>
        <div class="panel">
          <h3>💸 طلبات السحب</h3>
          <table id="withdrawalsTable"><thead><tr><th>المستخدم</th><th>المبلغ</th><th>الشبكة</th><th>المحفظة</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody></tbody></table>
        </div>
      </div>

      <div class="panel">
        <h3>👥 المستخدمون</h3>
        <table id="usersTable"><thead><tr><th>المستخدم</th><th>الرصيد</th><th>الباقة</th></tr></thead><tbody></tbody></table>
      </div>

      <div class="panel">
        <h3>💰 إضافة أرباح يومية</h3>
        <select id="profitUserSelect"><option value="">اختر المستخدم</option></select>
        <input type="number" id="profitAmt" placeholder="المبلغ المراد إضافته ($)">
        <button id="addProfitBtn">إضافة الربح للرصيد</button>
      </div>
      <button id="logoutBtn" style="background:var(--danger); margin-top:20px; width:auto;">خروج</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBEPY92lQXZHchrmPbmeNRjFG3FtkiN3a0",
      authDomain: "vaultusd-c1998.firebaseapp.com",
      databaseURL: "https://vaultusd-c1998-default-rtdb.firebaseio.com",
      projectId: "vaultusd-c1998",
      storageBucket: "vaultusd-c1998.firebasestorage.app",
      messagingSenderId: "627849430299",
      appId: "1:627849430299:web:d5680cc24a21861f367fbe",
      measurementId: "G-N7T16JW68V"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const $ = id => document.getElementById(id);

    $('adminLoginBtn').onclick = () => {
      if($('adminPass').value === '0000') {
        $('loginBox').classList.add('hidden');
        $('adminPanel').classList.remove('hidden');
        startLiveListeners();
      } else alert('كلمة المرور خاطئة');
    };

    $('logoutBtn').onclick = () => location.reload();

    const startLiveListeners = () => {
      // إيداعات
      onSnapshot(collection(db, 'deposits'), (snap) => {
        const tbody = $('depositsTable').querySelector('tbody');
        tbody.innerHTML = '';
        snap.forEach(d => {
          const data = d.data();
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${data.username}</td>
            <td>$${data.amount}</td>
            <td>${data.network}</td>
            <td style="font-size:12px">${data.txId}</td>
            <td class="${data.status==='pending'?'status-pending':'status-done'}">${data.status==='pending'?'قيد المراجعة':'تمت الإضافة'}</td>
            <td>${data.status==='pending'?`<button onclick="window.confirmDeposit('${d.id}', '${data.uid}', ${data.amount})">تأكيد وإضافة</button>`:'-'}</td>
          `;
          tbody.appendChild(tr);
        });
      });

      // سحوبات
      onSnapshot(collection(db, 'withdrawals'), (snap) => {
        const tbody = $('withdrawalsTable').querySelector('tbody');
        tbody.innerHTML = '';
        snap.forEach(d => {
          const data = d.data();
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${data.username}</td>
            <td>$${data.amount}</td>
            <td>${data.network}</td>
            <td style="word-break:break-all; font-size:12px">${data.wallet}</td>
            <td class="${data.status==='pending'?'status-pending':'status-done'}">${data.status==='pending'?'قيد الانتظار':'تم الدفع'}</td>
            <td>${data.status==='pending'?`<button onclick="window.markPaid('${d.id}')">تأكيد الدفع</button>`:'-'}</td>
          `;
          tbody.appendChild(tr);
        });
      });

      // مستخدمون
      onSnapshot(collection(db, 'users'), (snap) => {
        const tbody = $('usersTable').querySelector('tbody');
        const select = $('profitUserSelect');
        tbody.innerHTML = '';
        select.innerHTML = '<option value="">اختر المستخدم</option>';
        
        snap.forEach(d => {
          const data = d.data();
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${data.username}</td><td>$${data.balance || 0}</td><td>${data.activePackage || 'غير مشترك'}</td>`;
          tbody.appendChild(tr);
          
          const opt = document.createElement('option');
          opt.value = d.id; opt.textContent = `${data.username} (رصيد: $${data.balance||0})`;
          select.appendChild(opt);
        });
      });
    };

    window.confirmDeposit = async (depId, uid, amount) => {
      if(!confirm(`تأكيد إضافة $${amount} لحساب المستخدم؟`)) return;
      try {
        await updateDoc(doc(db, 'users', uid), { balance: increment(amount), lastDepositAt: serverTimestamp() });
        await updateDoc(doc(db, 'deposits', depId), { status: 'completed', completedAt: serverTimestamp() });
      } catch(e) { alert('❌ ' + e.message); }
    };

    window.markPaid = async (id) => {
      if(!confirm('تأكيد دفع هذا السحب؟')) return;
      try { await updateDoc(doc(db, 'withdrawals', id), { status: 'paid', paidAt: serverTimestamp() }); }
      catch(e) { alert('❌ ' + e.message); }
    };

    $('addProfitBtn').onclick = async () => {
      const uid = $('profitUserSelect').value;
      const amt = parseFloat($('profitAmt').value);
      if(!uid || !amt || amt <= 0) return alert('اختر مستخدم وأدخل مبلغ صحيح');
      $('addProfitBtn').disabled = true; $('addProfitBtn').textContent = 'جاري الإضافة...';
      try {
        await updateDoc(doc(db, 'users', uid), { balance: increment(amt), lastProfitAdded: serverTimestamp() });
        alert('✅ تمت إضافة الربح');
        $('profitAmt').value = '';
      } catch(e) { alert('❌ ' + e.message); }
      finally { $('addProfitBtn').disabled = false; $('addProfitBtn').textContent = 'إضافة الربح للرصيد'; }
    };
  </script>
</body>
</html>
